[package]
name        = "pca9685-nv"
version     = "0.1.0"
description = "A driver for NXP's PCA9685 sixteen-channel, 12-bit PWM controller on an I2C bus: embedded-hal-nv's Pwm per channel, the prescale from the oscillator and the wanted frequency, the on and off counts with the full-on and full-off bits, the all-channel registers, the sleep and restart sequences, the output driver and invert bits, the sub-addresses and the all-call address, and a servo helper and an LED duty helper."
license     = "Apache-2.0"
stability   = "experimental"
category    = "embedded"
layer       = "host"
tags        = ["pca9685", "pwm", "servo", "led", "i2c", "motor", "nrf52840-dk", "nrf54lm20-dk"]
repository  = "https://github.com/novolang/pca9685-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.24.0"

[docs.pages]
"README.md" = "Driving a PCA9685 PWM controller from a device program"

[dependencies]
# The board's I2C bus, GPIO and timer handles, the I2cBus, GpioOut and
# Timer traits they implement, and the Pwm trait this driver implements.
embedded-hal-nv = "^0.3.2"
# The wiring record a board's device table hands `attach`, and the
# register helpers.
devices-nv      = "^0.3.2"
